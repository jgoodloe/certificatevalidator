services:
  # OPTIONAL standalone mTLS front-end (Mode B). Only needed if you are NOT
  # using the NPM-integrated mode: it owns the piv. / piv-any. handshake
  # itself and therefore needs host port 443 (or an L4 SNI passthrough in
  # front). Start it with:  docker compose --profile standalone up -d
  mtls-nginx:
    image: nginx:1.29
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "443:443"          # conflicts with NPM on the same host -- Mode B only
    volumes:
      - ./nginx/mtls.conf:/etc/nginx/conf.d/mtls.conf:ro
      - ./certs:/etc/nginx/certs:ro   # server.crt, server.key, fpki-cas.pem
    networks: [pivnet]
    depends_on: [validator-app]

  # Landing page with the four options. In NPM-integrated mode, front this
  # through NPM as a normal proxy host (certtesting.goodloe.xyz -> landing:80).
  landing:
    image: nginx:1.29
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks: [pivnet]
    # networks: [pivnet, proxynet]   # NPM-integrated mode: also join NPM's net

  # The Python validator. Never exposed publicly; only the mTLS-terminating
  # proxy (NPM proxy hosts, or mtls-nginx in standalone mode) may reach it,
  # because it trusts the X-Client-* / X-Authentik-* headers it receives.
  validator-app:
    build: ./app
    restart: unless-stopped
    environment:
      TRUST_DIR: /trust/anchors
      INTERMEDIATE_DIR: /trust/intermediates
      REQUIRED_GROUP: piv-validator     # authentik group required to validate
      GROUP_SEPARATOR: ","              # how authentik joins the groups header
    volumes:
      - ./trust:/trust:ro    # drop FPKI/NIST-test roots + intermediates here
    networks: [pivnet]
    # networks: [pivnet, proxynet]   # NPM-integrated mode: also join NPM's net

networks:
  pivnet:
    driver: bridge
    # Created automatically by compose; covers all container-to-container
    # traffic inside this project. No manual setup needed.

  # NPM-integrated mode (Mode A): uncomment this network AND the extra
  # `networks:` lines on landing/validator-app above so NPM can reach them
  # by container name. Set `name:` to NPM's actual network
  # (`docker network ls` / `docker inspect <npm-container>`).
  # proxynet:
  #   external: true
  #   name: npm_default

  # Standalone mode (Mode B) authentik note: mtls.conf's forward-auth calls
  # http://authentik-server:9000. The embedded outpost is NOT a separate
  # container -- it listens on port 9000 INSIDE the authentik server
  # container -- so that hostname must be your authentik server's Docker
  # name, and mtls-nginx must share a network with it (attach it the same
  # way as proxynet above). See docs/AUTHENTIK_SETUP.md section 2.
