# =====================================================================
# STANDALONE MODE (Mode B) ONLY. In the NPM-integrated mode (Mode A)
# this container does not run at all -- the equivalent config is pasted
# into NPM per proxy host from nginx/npm/piv.conf and piv-any.conf.
#
# Two mutual-TLS vhosts with authentik forward-auth (Option 1).
#
# Layer ordering inside each server block:
#   1. TLS handshake completes  -> browser cert picker fires
#   2. auth_request -> authentik outpost  -> proves OIDC session + group
#   3. outpost's X-authentik-* headers copied onto the upstream request
#   4. proxy_pass to validator-app, which enforces the piv-validator group
#
# The ONLY functional difference between the two vhosts is whether the
# CertificateRequest advertises acceptable CA DNs:
#   piv.*      -> ssl_client_certificate present  -> browser filters to
#                 federal CAs (PIV / PIV-I / CAC only)
#   piv-any.*  -> ssl_trusted_certificate only     -> empty CA DN list ->
#                 browser offers every client cert in the store
#
# Both use optional_no_ca: nginx REQUESTS a cert (picker appears) but does
# NOT reject on failure -- the Python app does the real cert validation.
#
# This container terminates TLS itself, so it needs host port 443 (or an
# L4 passthrough in front -- never an HTTP proxy hop, which would strip
# the client cert). It must be the ONLY path to validator-app, or the
# X-authentik-* / X-Client-* headers become forgeable.
# =====================================================================

# Resolver so the outpost hostname resolves at request time (Docker DNS).
resolver 127.0.0.11 valid=30s;

# ---- Shared forward-auth snippet ------------------------------------
# Included in each server. Sends a subrequest to the embedded authentik
# outpost; on 2xx the request proceeds, on 401/403 nginx returns the
# outpost's redirect to the authentik login flow.
#
# NOTE: the outpost is reached over the internal Docker network. The
# Application in authentik must have the piv-validator group bound to it,
# so only members pass this check at all (gate-level RBAC). The app then
# re-checks the group header (defence in depth).

# ---- PIV / PIV-I / CAC filtered endpoint -----------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name piv.certtesting.goodloe.xyz;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Subject DNs here are advertised to the browser -> federal certs only.
    ssl_client_certificate /etc/nginx/certs/fpki-cas.pem;
    ssl_verify_client optional_no_ca;
    ssl_verify_depth 6;

    # --- authentik forward-auth ---
    location /outpost.goauthentik.io {
        internal;
        proxy_pass http://authentik-server:9000/outpost.goauthentik.io;
        proxy_set_header Host                 $host;
        proxy_set_header X-Original-URL       $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header X-Forwarded-Host     $http_host;
        proxy_set_header X-Forwarded-Uri      $request_uri;
        proxy_set_header X-Forwarded-For      $remote_addr;
        add_header       Set-Cookie           $auth_cookie;
        auth_request_set $auth_cookie         $upstream_http_set_cookie;
    }

    location / {
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page 401   = @goauthentik_proxy_signin;

        # Copy identity from the outpost onto variables, then upstream.
        auth_request_set $authentik_username  $upstream_http_x_authentik_username;
        auth_request_set $authentik_groups    $upstream_http_x_authentik_groups;
        auth_request_set $authentik_email     $upstream_http_x_authentik_email;
        auth_request_set $auth_cookie         $upstream_http_set_cookie;
        add_header       Set-Cookie           $auth_cookie;

        proxy_pass http://validator-app:8000;
        proxy_set_header Host                  $host;

        # Client cert from the TLS handshake.
        proxy_set_header X-Client-Cert         $ssl_client_escaped_cert;
        proxy_set_header X-Client-Verify       $ssl_client_verify;
        proxy_set_header X-Client-SDN          $ssl_client_s_dn;
        proxy_set_header X-Client-IDN          $ssl_client_i_dn;

        # authentik identity for app-side RBAC.
        proxy_set_header X-Authentik-Username  $authentik_username;
        proxy_set_header X-Authentik-Groups    $authentik_groups;
        proxy_set_header X-Authentik-Email     $authentik_email;
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$request_uri;
    }
}

# ---- Any-certificate endpoint ---------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name piv-any.certtesting.goodloe.xyz;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # No ssl_client_certificate: use ssl_trusted_certificate for chain
    # building without advertising DNs -> empty CA list -> all certs shown.
    ssl_trusted_certificate /etc/nginx/certs/fpki-cas.pem;
    ssl_verify_client optional_no_ca;
    ssl_verify_depth 6;

    location /outpost.goauthentik.io {
        internal;
        proxy_pass http://authentik-server:9000/outpost.goauthentik.io;
        proxy_set_header Host                 $host;
        proxy_set_header X-Original-URL       $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header X-Forwarded-Host     $http_host;
        proxy_set_header X-Forwarded-Uri      $request_uri;
        proxy_set_header X-Forwarded-For      $remote_addr;
        add_header       Set-Cookie           $auth_cookie;
        auth_request_set $auth_cookie         $upstream_http_set_cookie;
    }

    location / {
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page 401   = @goauthentik_proxy_signin;

        auth_request_set $authentik_username  $upstream_http_x_authentik_username;
        auth_request_set $authentik_groups    $upstream_http_x_authentik_groups;
        auth_request_set $authentik_email     $upstream_http_x_authentik_email;
        auth_request_set $auth_cookie         $upstream_http_set_cookie;
        add_header       Set-Cookie           $auth_cookie;

        proxy_pass http://validator-app:8000;
        proxy_set_header Host                  $host;

        proxy_set_header X-Client-Cert         $ssl_client_escaped_cert;
        proxy_set_header X-Client-Verify       $ssl_client_verify;
        proxy_set_header X-Client-SDN          $ssl_client_s_dn;
        proxy_set_header X-Client-IDN          $ssl_client_i_dn;

        proxy_set_header X-Authentik-Username  $authentik_username;
        proxy_set_header X-Authentik-Groups    $authentik_groups;
        proxy_set_header X-Authentik-Email     $authentik_email;
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$request_uri;
    }
}
