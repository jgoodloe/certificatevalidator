# =====================================================================
# NPM-integrated mode: paste this whole file into
#   Nginx Proxy Manager > Proxy Host "piv.<your-domain>" > Advanced >
#   Custom Nginx Configuration
#
# Proxy host settings in the NPM UI:
#   Forward Hostname/IP: validator-app   Forward Port: 8000  Scheme: http
#   SSL: your server cert (Let's Encrypt DNS-01 works)
#
# NPM injects this inside the generated server{} block, and because a
# custom "location /" is defined here NPM skips generating its own, so
# nothing below collides with NPM's defaults.
#
# This vhost advertises the federal CA DNs in the TLS CertificateRequest,
# so browsers only offer PIV / PIV-I / CAC certificates. Copy the bundle
# into NPM's data volume first:
#   cp certs/fpki-cas.pem <npm-data-dir>/custom_ssl/fpki-cas.pem
#
# optional_no_ca: NPM REQUESTS a cert (picker appears) but does NOT
# reject on failure -- the Python app does the real validation.
# =====================================================================

ssl_client_certificate /data/custom_ssl/fpki-cas.pem;
ssl_verify_client optional_no_ca;
ssl_verify_depth 6;

# --- authentik forward-auth (embedded outpost) -----------------------
# "authentik-server" is a PLACEHOLDER for your authentik SERVER
# container's Docker name (official compose: the `server` service). The
# embedded outpost is not a separate container -- it listens on port
# 9000 inside the server container. NPM must share a Docker network
# with it. See docs/AUTHENTIK_SETUP.md section 2.
location /outpost.goauthentik.io {
    internal;
    proxy_pass http://authentik-server:9000/outpost.goauthentik.io;
    proxy_set_header Host                 $host;
    proxy_set_header X-Original-URL       $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-Proto    $scheme;
    proxy_set_header X-Forwarded-Host     $http_host;
    proxy_set_header X-Forwarded-Uri      $request_uri;
    proxy_set_header X-Forwarded-For      $remote_addr;
    add_header       Set-Cookie           $auth_cookie;
    auth_request_set $auth_cookie         $upstream_http_set_cookie;
}

location / {
    auth_request     /outpost.goauthentik.io/auth/nginx;
    error_page 401   = @goauthentik_proxy_signin;

    auth_request_set $authentik_username  $upstream_http_x_authentik_username;
    auth_request_set $authentik_groups    $upstream_http_x_authentik_groups;
    auth_request_set $authentik_email     $upstream_http_x_authentik_email;
    auth_request_set $auth_cookie         $upstream_http_set_cookie;
    add_header       Set-Cookie           $auth_cookie;

    # $server/$port come from the NPM UI (validator-app / 8000).
    proxy_pass $forward_scheme://$server:$port;
    proxy_set_header Host                  $host;

    # Client cert captured by NPM's own TLS handshake.
    proxy_set_header X-Client-Cert         $ssl_client_escaped_cert;
    proxy_set_header X-Client-Verify       $ssl_client_verify;
    proxy_set_header X-Client-SDN          $ssl_client_s_dn;
    proxy_set_header X-Client-IDN          $ssl_client_i_dn;

    # authentik identity for app-side RBAC.
    proxy_set_header X-Authentik-Username  $authentik_username;
    proxy_set_header X-Authentik-Groups    $authentik_groups;
    proxy_set_header X-Authentik-Email     $authentik_email;
}

location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$request_uri;
}
