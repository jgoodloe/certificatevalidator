# Auto-merge Dependabot PRs for non-major updates once CI is green.
#
# One-time repo setup this depends on (see README "Automated updates"):
#   1. Settings > General > "Allow auto-merge" must be enabled.
#   2. A ruleset/branch protection on the default branch requiring the
#      "validate" status check — otherwise `gh pr merge --auto` has nothing
#      to wait for and errors out (the PR then simply stays open for a
#      manual merge; nothing unsafe happens).
#
# Major version bumps are left open for human review.
name: dependabot-automerge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Keyed off the PR author, not github.actor: a reopen or manual
    # re-trigger by a human still processes Dependabot's PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (minor/patch only)
        # Allow-list, not a block-list: fetch-metadata returns null for
        # version specs it can't parse as semver (e.g. wildcard pins like
        # ==43.*), and `!= semver-major` would fail OPEN on null — that
        # once auto-merged a major. Unknown now fails CLOSED (PR stays
        # open for review). requirements.txt uses exact pins so pip
        # updates classify correctly.
        if: >-
          contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'),
                   steps.metadata.outputs.update-type)
        # No `gh pr review --approve` here: the ruleset requires the
        # "validate" status check, not reviews, and repos block Actions
        # from approving PRs by default anyway.
        #
        # `--auto` errors if the PR is already in clean status (checks
        # finished green before this ran); the fallback merges directly,
        # which the ruleset only permits when "validate" has passed.
        run: |
          gh pr merge --auto --squash "$PR_URL" \
            || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
