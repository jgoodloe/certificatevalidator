# Monthly watchdog for the Federal PKI download sources.
#
# certs/ and trust/ are deliberately not committed (deployment-specific),
# so this does NOT update anything in the repo. It re-runs the fetch
# script against GSA's live repository; if GSA moves or breaks the files,
# the run fails and GitHub emails the repo owner. The job summary records
# the current bundle hash and cert count, so the run history doubles as a
# change log of FPKI bundle revisions.
#
# The actual refresh on your server is a host-side cron — see the README
# "Automated updates" section.
name: fpki-source-check

on:
  schedule:
    - cron: '17 6 3 * *'   # 06:17 UTC on the 3rd of each month
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current FPKI bundle from GSA
        run: ./scripts/fetch-fpki-certs.sh --bridge

      - name: Record bundle fingerprint
        run: |
          count=$(grep -c 'BEGIN CERTIFICATE' certs/fpki-cas.pem)
          sha=$(sha256sum certs/fpki-cas.pem | cut -d' ' -f1)
          {
            echo "### FPKI bundle check"
            echo "- Certificates in bundle: ${count}"
            echo "- Bundle SHA-256: \`${sha}\`"
            echo
            echo "Compare with the previous run's summary to see whether GSA"
            echo "published new CAs; if so, re-run the fetch script on your host."
          } >> "$GITHUB_STEP_SUMMARY"
