# CI gate for auto-merged updates: if this passes, a Dependabot bump is
# considered safe to land. Required-check name for rulesets: "validate".
name: ci

on:
  pull_request:
  push:
    branches: [main, master, claude/project-build-bqm2qy]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose files (both modes)
        run: |
          docker compose config -q
          docker compose --profile standalone config -q

      - name: Build validator-app image
        run: docker build -t validator-app ./app

      - name: Smoke-test the app imports
        run: docker run --rm validator-app python -c "import main; print('validator-app imports OK')"

      # --- CVE gate: a PR introducing fixable HIGH/CRITICAL vulns fails CI,
      # so it can neither auto-merge nor be released. Findings with no
      # released fix don't block PRs (nothing to update to); the release
      # pipeline escalates those to the owner instead.
      - name: pip-audit (Python dependency CVEs)
        run: |
          python3 -m pip install -q pip-audit
          pip-audit -r app/requirements.txt -f json -o pip-audit.json || true

      - name: Trivy scan (image + OS package CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA-pinned: tags were force-pushed in the 2026-03 supply-chain incident)
        with:
          image-ref: validator-app
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Security gate
        id: gate
        run: ./scripts/security-gate.sh pip-audit.json trivy.json

      - name: Fail on fixable vulnerabilities
        if: steps.gate.outputs.verdict == 'fail'
        run: |
          echo "::error::Fixable HIGH/CRITICAL vulnerabilities — see security gate summary."
          exit 1
